# =============================================================
# Nginx vhost — Assistant de Direction (API)
# =============================================================
# Cible : https://api-assistant-ia.horus-lab.com
# Proxy : 127.0.0.1:8421  (docker compose api)
#
# Installation sur le serveur :
#   sudo cp deploy/nginx/api-assistant-ia.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api-assistant-ia.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t                          # verifie la syntaxe
#   sudo systemctl reload nginx            # applique
#   sudo certbot --nginx -d api-assistant-ia.horus-lab.com
#
# Certbot va automatiquement modifier ce fichier pour ajouter les
# directives ssl_certificate / ssl_certificate_key et la redirection
# HTTP -> HTTPS. Inutile de configurer SSL a la main.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api-assistant-ia.horus-lab.com;

    # Protege la doc Swagger derriere une taille de body raisonnable
    # (les documents a synthetiser peuvent atteindre ~12000 caracteres,
    # 5 Mo est largement au-dessus du besoin).
    client_max_body_size 5m;

    # Logs dedies pour faciliter le debug en prod.
    access_log /var/log/nginx/api-assistant-ia-access.log;
    error_log  /var/log/nginx/api-assistant-ia-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8421;

        # Headers indispensables pour que FastAPI / le LLM voient
        # le bon host et la bonne IP cliente.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les appels au LLM (Groq + tool calling boucle) peuvent
        # prendre 30 a 90 secondes. On augmente les timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Empeche le buffering qui retarderait les reponses
        # (utile si on streame plus tard).
        proxy_buffering off;
    }
}
