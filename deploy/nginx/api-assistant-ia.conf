# =============================================================
# Nginx vhost — Assistant de Direction (API)
# Cible : https://api-assistant-ia.horus-lab.com
# =============================================================
# Architecture sur le serveur :
#   Internet -> nginx du projet "afrikamode" (ports 80/443 host)
#            -> container assistant-direction-api (port 8000 interne)
#               via le reseau Docker partage "backend_default".
#
# Ce fichier est destine a etre APPENDE au /etc/nginx/conf.d/default.conf
# du projet afrikamode :
#
#   cat deploy/nginx/api-assistant-ia.conf \
#     >> /home/deploy/afrikamode/backend/deploy/nginx/default.conf
#   docker restart backend-nginx-1
#
# Le certificat Let's Encrypt est genere via le certbot container
# d'afrikamode (volumes backend_certbot_certs + backend_certbot_www).
# =============================================================

# HTTP : challenge ACME + redirect vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api-assistant-ia.horus-lab.com;

    # Endpoint Let's Encrypt (HTTP-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS : reverse proxy vers le container assistant-direction-api
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-assistant-ia.horus-lab.com;

    ssl_certificate     /etc/letsencrypt/live/api-assistant-ia.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-assistant-ia.horus-lab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limite uploads (documents a synthetiser, ~12k caracteres).
    client_max_body_size 5M;

    location / {
        # Le container "assistant-direction-api" est resolu par le DNS
        # Docker interne grace au reseau partage "backend_default".
        proxy_pass http://assistant-direction-api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Les appels Groq + tool calling peuvent durer 30-90s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Pas de buffering : reponses streamables a l'avenir.
        proxy_buffering off;
    }
}
